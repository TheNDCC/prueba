[project]
name = "utilidades-km9"
version = "0.1.0"
description = "Python desktop application for processing restaurant sales data from PedidosYa and Promicsyst"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.0",
    "openpyxl>=3.1.0",
    "numpy>=2.4.0",
    "matplotlib>=3.10.0",
    "Pillow>=11.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2025.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
extend-ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
